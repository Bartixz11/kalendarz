<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nowoczesny Planer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        /* ZMIENNE CSS DLA MOTYWÓW I KOLORÓW */
        :root {
            --bg-color: #0f172a; 
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --glass-bg: rgba(15, 23, 42, 0.7);
        }

        /* RESET I PODSTAWY */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior-y: contain;
        }

        /* LAYOUT GŁÓWNY */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* NAWIGACJA (Menu boczne domyślnie) */
        nav {
            width: 240px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 700;
            padding: 0 10px;
            margin-bottom: 15px;
            color: var(--accent);
            text-align: center;
        }

        .nav-item {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 1rem;
            color: var(--text-muted);
            background-color: transparent;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: var(--surface-hover);
            border-color: var(--border);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .nav-item span {
            margin-left: 10px;
        }

        /* GŁÓWNA ZAWARTOŚĆ ZAKŁADEK */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Wskaźnik przeciągnięcia (pull-to-refresh) */
        .ptr-indicator {
            position: absolute;
            top: -40px;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: transform 0.2s ease;
            z-index: 100;
        }

        .tab-content {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease-in-out;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ZAKŁADKA 1: KALENDARZ */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background-color: var(--surface-color);
            padding: 10px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            gap: 10px;
            flex-shrink: 0;
        }

        .month-nav-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calendar-header button.month-btn {
            background-color: var(--surface-hover);
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .calendar-header button.month-btn:hover {
            background-color: var(--accent);
        }

        .month-year {
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: capitalize;
            min-width: 140px;
            text-align: center;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-text-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .refresh-text-btn:hover {
            background-color: var(--surface-hover);
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .header-add-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            font-size: 22px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        .header-add-btn:hover {
            transform: scale(1.08);
            background-color: var(--accent-hover);
        }

        .calendar-grid {
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: var(--surface-color);
            border-radius: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid var(--border);
            min-height: 0; /* Kluczowe dla poprawnego dopasowania flexa */
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: var(--surface-hover);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .weekdays div {
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr); /* 6 rzędów gwarantuje stabilną wysokość i brak kurczenia */
            flex: 1;
            height: 100%;
        }

        .day {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .day:nth-child(7n) {
            border-right: none;
        }

        .day:hover:not(.empty) {
            background-color: var(--surface-hover);
        }

        .day.empty {
            background-color: rgba(30, 41, 59, 0.3);
            cursor: default;
        }

        .day-number {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 2px;
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .day.today .day-number {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
        }

        .events-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
        }

        .events-container::-webkit-scrollbar {
            width: 3px;
        }
        .events-container::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 4px;
        }

        .event-badge {
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: var(--accent);
            flex-shrink: 0;
        }

        /* INNE ZAKŁADKI (Wspólne style) */
        .header-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background-color: var(--surface-hover);
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .search-icon {
            font-size: 1.1rem;
            margin-right: 10px;
            color: var(--text-muted);
        }

        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        
        .list-container {
            background-color: var(--surface-color);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item-info {
            flex: 1;
            min-width: 0;
        }

        .list-item-info strong {
            display: block;
            font-size: 1rem;
            margin-bottom: 3px;
        }
        
        .list-item-info span {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .list-item-actions {
            display: flex;
            gap: 6px;
        }

        .edit-btn {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border: 1px solid transparent;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .edit-btn:hover {
            background-color: var(--accent);
            color: white;
        }

        .delete-btn {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid transparent;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        .no-events {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }

        .notif-form-container, .category-form, .settings-group {
            background-color: var(--surface-color);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .notif-row, .category-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .notif-row > div, .category-row > div {
            flex: 1;
        }

        .notif-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .notif-status {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
            margin-left: 8px;
        }

        .notif-status.pending {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .settings-group h3 {
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-picker-container {
            display: flex;
            gap: 12px;
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }

        .color-option.active {
            border-color: white;
            transform: scale(1.1);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--glass-bg);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-save {
            background-color: var(--accent);
            color: white;
        }

        /* RESPONSYWNOŚĆ TELEFONY - ZAKŁADKI NA GÓRZE */
        @media (max-width: 768px) {
            body {
                height: 100vh;
                height: -webkit-fill-available;
            }

            .app-container {
                flex-direction: column;
            }
            
            nav {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                padding: 6px 4px;
                gap: 2px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                order: 1;
                background-color: var(--surface-color);
                flex-shrink: 0;
            }

            .nav-logo {
                display: none;
            }

            .nav-item {
                flex-direction: column;
                padding: 6px 2px;
                font-size: 0.7rem;
                flex: 1;
                text-align: center;
                justify-content: center;
                border-radius: 8px;
            }

            .nav-item span {
                margin-left: 0;
                margin-top: 3px;
                font-size: 0.65rem;
            }

            main {
                order: 2;
                height: calc(100vh - 55px);
            }

            .tab-content {
                padding: 10px;
            }

            .calendar-header {
                padding: 8px 12px;
                margin-bottom: 8px;
            }

            .month-year {
                font-size: 1rem;
                min-width: 90px;
            }

            .refresh-text-btn {
                padding: 5px 8px;
                font-size: 0.75rem;
            }

            .header-add-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .weekdays div {
                padding: 6px 2px;
                font-size: 0.75rem;
            }

            .list-item-actions {
                flex-direction: column;
                gap: 4px;
            }

            .edit-btn, .delete-btn {
                padding: 5px 8px;
                font-size: 0.75rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- MENU (Na telefonach u góry, na komputerze z boku) -->
    <nav>
        <div class="nav-logo">Planer</div>
        <div class="nav-item active" data-target="tab-calendar">
            📅 <span>Kalendarz</span>
        </div>
        <div class="nav-item" data-target="tab-events">
            📋 <span>Wydarzenia</span>
        </div>
        <div class="nav-item" data-target="tab-notifications">
            🔔 <span>Powiadomienia</span>
        </div>
        <div class="nav-item" data-target="tab-categories">
            🏷️ <span>Kategorie</span>
        </div>
        <div class="nav-item" data-target="tab-settings">
            ⚙️ <span>Ustawienia</span>
        </div>
    </nav>

    <!-- GŁÓWNA ZAWARTOŚĆ -->
    <main id="mainScrollContainer">
        <!-- Wskaźnik przeciągnięcia do odświeżenia -->
        <div class="ptr-indicator" id="ptrIndicator">🔄 Pociągnij, aby odświeżyć...</div>

        <!-- ZAKŁADKA 1: KALENDARZ -->
        <div id="tab-calendar" class="tab-content active">
            <div class="calendar-header">
                <div class="month-nav-container">
                    <button class="month-btn" id="prevMonth">&#10094;</button>
                    <div class="month-year" id="monthYear"></div>
                    <button class="month-btn" id="nextMonth">&#10095;</button>
                </div>
                <div class="header-actions">
                    <button class="refresh-text-btn" id="refreshBtn" title="Odśwież stronę">🔄 Odśwież</button>
                    <button id="globalAddBtn" class="header-add-btn" aria-label="Dodaj nowe wydarzenie" title="Dodaj wydarzenie">+</button>
                </div>
            </div>
            <div class="calendar-grid">
                <div class="weekdays">
                    <div>Pn</div><div>Wt</div><div>Śr</div><div>Cz</div><div>Pt</div><div>Sb</div><div>Nd</div>
                </div>
                <div class="days" id="daysContainer"></div>
            </div>
        </div>

        <!-- ZAKŁADKA 2: LISTA WYDARZEŃ -->
        <div id="tab-events" class="tab-content">
            <h1 class="header-title">Wydarzenia</h1>
            <div class="filter-container">
                <button class="filter-btn active" data-filter="upcoming">Nadchodzące</button>
                <button class="filter-btn" data-filter="past">Przeminięte</button>
                <button class="filter-btn" data-filter="all">Wszystkie</button>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Wyszukaj wydarzenie...">
            </div>
            <div class="list-container" id="eventsListContainer"></div>
        </div>

        <!-- ZAKŁADKA 3: POWIADOMIENIA -->
        <div id="tab-notifications" class="tab-content">
            <h1 class="header-title">Powiadomienia</h1>
            <div class="notif-form-container">
                <h3 style="margin-bottom: 10px; font-size: 1rem; color: var(--text-muted);">Nowe przypomnienie</h3>
                <div class="form-group">
                    <label>Tytuł</label>
                    <input type="text" id="notifTitle" placeholder="np. Wyłączyć piekarnik" autocomplete="off">
                </div>
                <div class="notif-row">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Data</label>
                        <input type="date" id="notifDate">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Godzina</label>
                        <input type="time" id="notifTime">
                    </div>
                </div>
                <button class="notif-btn" id="btnSaveNotif" style="margin-top: 12px;">Zaplanuj</button>
            </div>
            <div class="list-container" id="notificationsListContainer"></div>
        </div>

        <!-- ZAKŁADKA 4: KATEGORIE -->
        <div id="tab-categories" class="tab-content">
            <h1 class="header-title">Zarządzaj Kategoriami</h1>
            <div class="category-form">
                <h3 style="margin-bottom: 10px; font-size: 1rem; color: var(--text-muted);">Dodaj nową kategorię</h3>
                <div class="category-row">
                    <div class="form-group" style="flex: 2; margin-bottom: 0;">
                        <label>Nazwa (np. Szkoła)</label>
                        <input type="text" id="catNameInput" placeholder="Nazwa kategorii" autocomplete="off">
                    </div>
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Kolor</label>
                        <input type="color" id="catColorInput" value="#8b5cf6" style="height: 42px; padding: 4px; cursor: pointer;">
                    </div>
                    <button class="btn btn-save" id="btnAddCategory" style="height: 42px; flex: 1; margin-bottom: 0;">Dodaj</button>
                </div>
            </div>
            <div class="list-container" id="categoriesListContainer"></div>
        </div>

        <!-- ZAKŁADKA 5: USTAWIENIA -->
        <div id="tab-settings" class="tab-content">
            <h1 class="header-title">Ustawienia</h1>
            <div class="settings-group">
                <h3>Motyw i Kolor Akcentu</h3>
                <div class="color-picker-container">
                    <div class="color-option active" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
                    <div class="color-option" style="background-color: #10b981;" data-color="#10b981"></div>
                    <div class="color-option" style="background-color: #8b5cf6;" data-color="#8b5cf6"></div>
                    <div class="color-option" style="background-color: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-option" style="background-color: #f59e0b;" data-color="#f59e0b"></div>
                </div>
            </div>
            <div class="settings-group">
                <h3>Kopia zapasowa</h3>
                <textarea id="syncCodeInput" rows="3" style="width: 100%; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 10px; font-family: monospace;" placeholder="Kod synchronizacji..."></textarea>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-cancel" id="btnGenerateCode">Eksport</button>
                    <button class="btn btn-save" id="btnLoadCode">Import</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- MODAL WYDARZENIA -->
<div class="modal-overlay" id="eventModal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitleText">Nowe Wydarzenie</div>
        <div class="modal-body">
            <div id="dayExistingEventsContainer" style="margin-bottom: 15px; display: none;">
                <label style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px; display: block;">Istniejące wpisy w tym dniu:</label>
                <div id="dayEventsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
                <hr style="border: none; border-top: 1px solid var(--border); margin: 15px 0 10px 0;">
            </div>

            <input type="hidden" id="editDateKey">
            <input type="hidden" id="editIndex">
            <div class="form-group">
                <label for="eventDateInput">Data</label>
                <input type="date" id="eventDateInput">
            </div>
            <div class="form-group">
                <label for="eventTitle">Nazwa</label>
                <input type="text" id="eventTitle" placeholder="np. Sprawdzian z matmy" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="eventDescription">Opis (opcjonalnie)</label>
                <textarea id="eventDescription" rows="2" placeholder="Notatki..."></textarea>
            </div>
            <div class="form-group">
                <label for="eventTime">Godzina</label>
                <input type="time" id="eventTime">
            </div>
            <div class="form-group">
                <label for="eventType">Kategoria</label>
                <select id="eventType"></select>
            </div>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-cancel" id="btnCancelModal">Anuluj</button>
            <button class="btn btn-save" id="btnSaveEvent">Zapisz nowy / Dodaj</button>
        </div>
    </div>
</div>

<script>
    const monthYearDisplay = document.getElementById('monthYear');
    const daysContainer = document.getElementById('daysContainer');
    const eventsListContainer = document.getElementById('eventsListContainer');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const searchInput = document.getElementById('searchInput');
    const refreshBtn = document.getElementById('refreshBtn');

    const globalAddBtn = document.getElementById('globalAddBtn');
    const eventModal = document.getElementById('eventModal');
    const modalTitleText = document.getElementById('modalTitleText');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const btnSaveEvent = document.getElementById('btnSaveEvent');
    
    const editDateKeyInput = document.getElementById('editDateKey');
    const editIndexInput = document.getElementById('editIndex');
    const eventDateInput = document.getElementById('eventDateInput');
    const eventTitleInput = document.getElementById('eventTitle');
    const eventDescInput = document.getElementById('eventDescription');
    const eventTimeInput = document.getElementById('eventTime');
    const eventTypeInput = document.getElementById('eventType');
    const dayExistingEventsContainer = document.getElementById('dayExistingEventsContainer');
    const dayEventsList = document.getElementById('dayEventsList');

    const syncCodeInput = document.getElementById('syncCodeInput');
    const btnGenerateCode = document.getElementById('btnGenerateCode');
    const btnLoadCode = document.getElementById('btnLoadCode');

    const notifTitleInput = document.getElementById('notifTitle');
    const notifDateInput = document.getElementById('notifDate');
    const notifTimeInput = document.getElementById('notifTime');
    const btnSaveNotif = document.getElementById('btnSaveNotif');
    const notificationsListContainer = document.getElementById('notificationsListContainer');

    const catNameInput = document.getElementById('catNameInput');
    const catColorInput = document.getElementById('catColorInput');
    const btnAddCategory = document.getElementById('btnAddCategory');
    const categoriesListContainer = document.getElementById('categoriesListContainer');

    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'upcoming';

    const monthNames = [
        'Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
        'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'
    ];

    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();

    let eventsData = JSON.parse(localStorage.getItem('planerEvents')) || {};
    let notificationsData = JSON.parse(localStorage.getItem('planerNotifications')) || [];
    
    let categoriesData = JSON.parse(localStorage.getItem('planerCategories')) || [
        { id: 'default', name: 'Standardowe', color: '#3b82f6' },
        { id: 'work', name: 'Praca', color: '#ef4444' },
        { id: 'personal', name: 'Prywatne', color: '#10b981' },
        { id: 'school', name: 'Szkoła', color: '#8b5cf6' }
    ];

    refreshBtn.addEventListener('click', () => {
        location.reload();
    });

    const mainScrollContainer = document.getElementById('mainScrollContainer');
    const ptrIndicator = document.getElementById('ptrIndicator');
    let touchStartY = 0;
    let isPulling = false;

    mainScrollContainer.addEventListener('touchstart', (e) => {
        if (mainScrollContainer.scrollTop === 0) {
            touchStartY = e.touches[0].clientY;
            isPulling = true;
        }
    }, { passive: true });

    mainScrollContainer.addEventListener('touchmove', (e) => {
        if (!isPulling) return;
        const touchY = e.touches[0].clientY;
        const diff = touchY - touchStartY;

        if (diff > 0 && diff < 120) {
            ptrIndicator.style.transform = `translateY(${diff}px)`;
            if (diff > 80) {
                ptrIndicator.textContent = '🔄 Puść, aby odświeżyć';
            } else {
                ptrIndicator.textContent = '🔄 Pociągnij, aby odświeżyć...';
            }
        }
    }, { passive: true });

    mainScrollContainer.addEventListener('touchend', (e) => {
        if (!isPulling) return;
        const touchY = e.changedTouches[0].clientY;
        const diff = touchY - touchStartY;

        if (diff > 80 && mainScrollContainer.scrollTop === 0) {
            ptrIndicator.textContent = 'Odświeżanie...';
            ptrIndicator.style.transform = `translateY(50px)`;
            setTimeout(() => {
                location.reload();
            }, 400);
        } else {
            ptrIndicator.style.transform = `translateY(0px)`;
        }
        isPulling = false;
    });

    function saveCategoriesToStorage() {
        localStorage.setItem('planerCategories', JSON.stringify(categoriesData));
    }

    function updateCategorySelect() {
        eventTypeInput.innerHTML = '';
        categoriesData.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            eventTypeInput.appendChild(opt);
        });
    }

    function renderCategoriesList() {
        categoriesListContainer.innerHTML = '';
        if (categoriesData.length === 0) {
            categoriesListContainer.innerHTML = '<div class="no-events">Brak zdefiniowanych kategorii.</div>';
            return;
        }

        categoriesData.forEach((cat, index) => {
            const item = document.createElement('div');
            item.classList.add('list-item');

            const info = document.createElement('div');
            info.classList.add('list-item-info');
            info.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="width: 16px; height: 16px; background-color: ${cat.color}; border-radius: 4px; display: inline-block;"></span>
                    <strong>${cat.name}</strong>
                </div>
            `;

            const delBtn = document.createElement('button');
            delBtn.classList.add('delete-btn');
            delBtn.textContent = 'Usuń';
            if (cat.id === 'default') {
                delBtn.style.opacity = '0.4';
                delBtn.style.cursor = 'not-allowed';
                delBtn.onclick = () => alert('Nie można usunąć domyślnej kategorii.');
            } else {
                delBtn.onclick = () => deleteCategory(index);
            }

            item.appendChild(info);
            item.appendChild(delBtn);
            categoriesListContainer.appendChild(item);
        });
    }

    btnAddCategory.addEventListener('click', () => {
        const name = catNameInput.value.trim();
        const color = catColorInput.value;

        if (!name) {
            alert('Wpisz nazwę kategorii!');
            return;
        }

        const id = 'cat_' + Date.now();
        categoriesData.push({ id, name, color });
        saveCategoriesToStorage();
        updateCategorySelect();
        renderCategoriesList();

        catNameInput.value = '';
    });

    function deleteCategory(index) {
        if (confirm('Usunąć tę kategorię?')) {
            categoriesData.splice(index, 1);
            saveCategoriesToStorage();
            updateCategorySelect();
            renderCategoriesList();
        }
    }

    function renderCalendar(month, year) {
        daysContainer.innerHTML = '';
        monthYearDisplay.textContent = `${monthNames[month]} ${year}`;

        let firstDay = new Date(year, month, 1).getDay();
        firstDay = firstDay === 0 ? 6 : firstDay - 1;

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('day', 'empty');
            daysContainer.appendChild(emptyDiv);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('day');
            
            const dateStr = `${year}-${month}-${i}`;
            
            const dayNumSpan = document.createElement('span');
            dayNumSpan.classList.add('day-number');
            dayNumSpan.textContent = i;
            dayDiv.appendChild(dayNumSpan);

            if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                dayDiv.classList.add('today');
            }

            const eventsCont = document.createElement('div');
            eventsCont.classList.add('events-container');

            if (eventsData[dateStr]) {
                eventsData[dateStr].sort((a, b) => (a.time || '').localeCompare(b.time || ''));

                eventsData[dateStr].forEach(ev => {
                    const evBadge = document.createElement('div');
                    evBadge.classList.add('event-badge');
                    
                    const catObj = categoriesData.find(c => c.id === ev.type);
                    if (catObj) {
                        evBadge.style.backgroundColor = catObj.color;
                    }

                    const timeText = ev.time ? `${ev.time} ` : '';
                    evBadge.innerHTML = `<span>${timeText}${ev.title}</span>`;
                    
                    if (ev.desc) evBadge.title = ev.desc;
                    eventsCont.appendChild(evBadge);
                });
            }

            dayDiv.appendChild(eventsCont);
            dayDiv.addEventListener('click', () => openModalForDay(dateStr, i, monthNames[month], year));
            daysContainer.appendChild(dayDiv);
        }
    }

    const navItems = document.querySelectorAll('.nav-item');
    const tabContents = document.querySelectorAll('.tab-content');

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(nav => nav.classList.remove('active'));
            tabContents.forEach(tab => tab.classList.remove('active'));
            
            item.classList.add('active');
            const targetId = item.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');

            if (targetId === 'tab-events') {
                renderEventsList();
            } else if (targetId === 'tab-notifications') {
                renderNotificationsList();
            } else if (targetId === 'tab-categories') {
                renderCategoriesList();
            }
        });
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.getAttribute('data-filter');
            renderEventsList(searchInput.value);
        });
    });

    function renderEventsList(searchQuery = '') {
        eventsListContainer.innerHTML = '';
        let allEvents = [];
        
        for (const dateStr in eventsData) {
            const [y, m, d] = dateStr.split('-').map(Number);
            eventsData[dateStr].forEach((ev, index) => {
                const eventDateObj = new Date(y, m, d, ...(ev.time ? ev.time.split(':') : [0,0]));
                allEvents.push({
                    ...ev,
                    dateStr: dateStr,
                    index: index,
                    displayDate: `${d} ${monthNames[m]} ${y}`,
                    dateObj: eventDateObj
                });
            });
        }

        allEvents.sort((a, b) => a.dateObj - b.dateObj);

        const now = new Date();
        now.setHours(0,0,0,0);

        let filteredEvents = allEvents;
        if (currentFilter === 'upcoming') {
            filteredEvents = allEvents.filter(ev => ev.dateObj >= now);
        } else if (currentFilter === 'past') {
            filteredEvents = allEvents.filter(ev => ev.dateObj < now);
        }

        if (searchQuery.trim() !== '') {
            const query = searchQuery.toLowerCase();
            filteredEvents = filteredEvents.filter(ev => 
                ev.title.toLowerCase().includes(query) || 
                (ev.desc && ev.desc.toLowerCase().includes(query))
            );
        }

        if (filteredEvents.length === 0) {
            let msg = 'Brak wydarzeń.';
            if (currentFilter === 'upcoming') msg = 'Brak nadchodzących wydarzeń.';
            if (currentFilter === 'past') msg = 'Brak przeminiętych wydarzeń.';
            if (searchQuery) msg = 'Brak wyników wyszukiwania.';
            eventsListContainer.innerHTML = `<div class="no-events">${msg}</div>`;
            return;
        }

        filteredEvents.forEach(ev => {
            const item = document.createElement('div');
            item.classList.add('list-item');
            
            const catObj = categoriesData.find(c => c.id === ev.type);
            const catBadgeHtml = catObj ? `<span style="background-color: ${catObj.color}; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 6px;">${catObj.name}</span>` : '';

            const info = document.createElement('div');
            info.classList.add('list-item-info');
            
            const timeStr = ev.time ? ` o ${ev.time}` : '';
            const descHtml = ev.desc ? `<div style="margin-top: 6px; font-size: 0.85rem; color: var(--text-muted);">${ev.desc}</div>` : '';
            
            info.innerHTML = `
                <div><strong>${ev.title}</strong> ${catBadgeHtml}</div>
                <span>${ev.displayDate}${timeStr}</span>
                ${descHtml}
            `;

            const actionsDiv = document.createElement('div');
            actionsDiv.classList.add('list-item-actions');

            const editBtn = document.createElement('button');
            editBtn.classList.add('edit-btn');
            editBtn.textContent = 'Edytuj';
            editBtn.onclick = () => openModalForEdit(ev.dateStr, ev.index);

            const delBtn = document.createElement('button');
            delBtn.classList.add('delete-btn');
            delBtn.textContent = 'Usuń';
            delBtn.onclick = () => deleteEvent(ev.dateStr, ev.index);

            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(delBtn);

            item.appendChild(info);
            item.appendChild(actionsDiv);
            eventsListContainer.appendChild(item);
        });
    }

    searchInput.addEventListener('input', (e) => renderEventsList(e.target.value));

    function renderNotificationsList() {
        notificationsListContainer.innerHTML = '';
        if (notificationsData.length === 0) {
            notificationsListContainer.innerHTML = '<div class="no-events">Brak zaplanowanych powiadomień.</div>';
            return;
        }

        notificationsData.sort((a, b) => new Date(a.fullDateTime) - new Date(b.fullDateTime));

        notificationsData.forEach((notif, index) => {
            const item = document.createElement('div');
            item.classList.add('list-item');
            
            const info = document.createElement('div');
            info.classList.add('list-item-info');
            
            const statusHtml = notif.fired ? '<span class="notif-status">Wysłano</span>' : '<span class="notif-status pending">Oczekuje</span>';

            info.innerHTML = `
                <strong>${notif.title} ${statusHtml}</strong>
                <span>Na kiedy: ${notif.dateStr} o ${notif.timeStr}</span>
            `;

            const delBtn = document.createElement('button');
            delBtn.classList.add('delete-btn');
            delBtn.textContent = 'Usuń';
            delBtn.onclick = () => deleteNotification(index);

            item.appendChild(info);
            item.appendChild(delBtn);
            notificationsListContainer.appendChild(item);
        });
    }

    btnSaveNotif.addEventListener('click', () => {
        const title = notifTitleInput.value.trim();
        const dateStr = notifDateInput.value;
        const timeStr = notifTimeInput.value;

        if (!title || !dateStr || !timeStr) {
            alert('Wypełnij wszystkie pola powiadomienia!');
            return;
        }

        const fullDateTime = new Date(`${dateStr}T${timeStr}`);
        if (fullDateTime <= new Date()) {
            alert('Czas powiadomienia musi być w przyszłości!');
            return;
        }

        if (Notification.permission !== 'granted') {
            Notification.requestPermission();
        }

        notificationsData.push({ title, dateStr, timeStr, fullDateTime: fullDateTime.toISOString(), fired: false });
        localStorage.setItem('planerNotifications', JSON.stringify(notificationsData));
        
        notifTitleInput.value = '';
        notifDateInput.value = '';
        notifTimeInput.value = '';
        renderNotificationsList();
    });

    function deleteNotification(index) {
        if (confirm('Usunąć powiadomienie?')) {
            notificationsData.splice(index, 1);
            localStorage.setItem('planerNotifications', JSON.stringify(notificationsData));
            renderNotificationsList();
        }
    }

    setInterval(() => {
        const now = new Date();
        let updated = false;

        notificationsData.forEach((notif) => {
            if (!notif.fired && now >= new Date(notif.fullDateTime)) {
                if (Notification.permission === 'granted') {
                    new Notification("Planer Przypomina:", { body: notif.title });
                } else {
                    alert(`🔔 PRZYPOMNIENIE: ${notif.title}`);
                }
                notif.fired = true;
                updated = true;
            }
        });

        if (updated) {
            localStorage.setItem('planerNotifications', JSON.stringify(notificationsData));
            if (document.getElementById('tab-notifications').classList.contains('active')) {
                renderNotificationsList();
            }
        }
    }, 30000);

    function openModalForDay(dateStr, day, monthName, year) {
        editDateKeyInput.value = '';
        editIndexInput.value = '';
        eventTitleInput.value = '';
        eventTimeInput.value = '';
        eventDescInput.value = '';
        updateCategorySelect();
        
        const [y, m, d] = dateStr.split('-');
        const formattedDate = `${y}-${String(parseInt(m)+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        eventDateInput.value = formattedDate;
        
        modalTitleText.textContent = `Dzień: ${day} ${monthName} ${year}`;
        
        dayEventsList.innerHTML = '';
        if (eventsData[dateStr] && eventsData[dateStr].length > 0) {
            dayExistingEventsContainer.style.display = 'block';
            eventsData[dateStr].forEach((ev, idx) => {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.justifyContent = 'space-between';
                row.style.alignItems = 'center';
                row.style.backgroundColor = 'var(--bg-color)';
                row.style.padding = '8px 10px';
                row.style.borderRadius = '8px';
                row.style.border = '1px solid var(--border)';

                const timeTxt = ev.time ? `${ev.time} - ` : '';
                const titleSpan = document.createElement('span');
                titleSpan.style.fontSize = '0.9rem';
                titleSpan.innerHTML = `<strong>${timeTxt}${ev.title}</strong>`;

                const btnGroup = document.createElement('div');
                btnGroup.style.display = 'flex';
                btnGroup.style.gap = '4px';

                const editBtn = document.createElement('button');
                editBtn.classList.add('edit-btn');
                editBtn.textContent = 'Edytuj';
                editBtn.style.padding = '3px 8px';
                editBtn.onclick = () => {
                    closeModal();
                    openModalForEdit(dateStr, idx);
                };

                const delBtn = document.createElement('button');
                delBtn.classList.add('delete-btn');
                delBtn.textContent = 'Usuń';
                delBtn.style.padding = '3px 8px';
                delBtn.onclick = () => {
                    eventsData[dateStr].splice(idx, 1);
                    if (eventsData[dateStr].length === 0) delete eventsData[dateStr];
                    localStorage.setItem('planerEvents', JSON.stringify(eventsData));
                    renderCalendar(currentMonth, currentYear);
                    if (eventsData[dateStr] && eventsData[dateStr].length > 0) {
                        openModalForDay(dateStr, day, monthName, year);
                    } else {
                        closeModal();
                    }
                };

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);
                row.appendChild(titleSpan);
                row.appendChild(btnGroup);
                dayEventsList.appendChild(row);
            });
        } else {
            dayExistingEventsContainer.style.display = 'none';
        }

        eventModal.classList.add('active');
    }

    function openModalForGlobalAdd() {
        editDateKeyInput.value = '';
        editIndexInput.value = '';
        eventTitleInput.value = '';
        eventTimeInput.value = '';
        eventDescInput.value = '';
        updateCategorySelect();
        dayExistingEventsContainer.style.display = 'none';

        const today = new Date();
        eventDateInput.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        modalTitleText.textContent = `Nowe Wydarzenie`;
        eventModal.classList.add('active');
    }

    function openModalForEdit(dateStr, index) {
        const ev = eventsData[dateStr][index];
        editDateKeyInput.value = dateStr;
        editIndexInput.value = index;
        dayExistingEventsContainer.style.display = 'none';
        
        const [y, m, d] = dateStr.split('-');
        eventDateInput.value = `${y}-${String(parseInt(m)+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        eventTitleInput.value = ev.title;
        eventDescInput.value = ev.desc || '';
        eventTimeInput.value = ev.time || '';
        
        updateCategorySelect();
        eventTypeInput.value = ev.type || 'default';

        modalTitleText.textContent = 'Edytuj Wydarzenie';
        eventModal.classList.add('active');
    }

    function closeModal() { 
        eventModal.classList.remove('active'); 
    }

    function saveEvent() {
        const title = eventTitleInput.value.trim();
        const desc = eventDescInput.value.trim();
        const time = eventTimeInput.value;
        const type = eventTypeInput.value;
        const dateVal = eventDateInput.value; 

        if (!title || !dateVal) {
            alert('Podaj nazwę i datę wydarzenia!');
            return;
        }

        const [yStr, mStr, dStr] = dateVal.split('-');
        const newDateStr = `${parseInt(yStr)}-${parseInt(mStr) - 1}-${parseInt(dStr)}`;

        const editDateKey = editDateKeyInput.value;
        const editIndex = editIndexInput.value;

        if (editDateKey !== "" && editIndex !== "") {
            eventsData[editDateKey].splice(editIndex, 1);
            if (eventsData[editDateKey].length === 0) {
                delete eventsData[editDateKey];
            }
        }

        if (!eventsData[newDateStr]) eventsData[newDateStr] = [];
        eventsData[newDateStr].push({ title, time, type, desc });
        
        localStorage.setItem('planerEvents', JSON.stringify(eventsData));

        renderCalendar(currentMonth, currentYear);
        if (document.getElementById('tab-events').classList.contains('active')) {
            renderEventsList(searchInput.value);
        }
        closeModal();
    }

    function deleteEvent(dateStr, index) {
        if (confirm('Usunąć to wydarzenie?')) {
            eventsData[dateStr].splice(index, 1);
            if (eventsData[dateStr].length === 0) delete eventsData[dateStr];
            localStorage.setItem('planerEvents', JSON.stringify(eventsData));
            renderEventsList(searchInput.value);
            renderCalendar(currentMonth, currentYear);
        }
    }

    btnGenerateCode.addEventListener('click', () => {
        if (Object.keys(eventsData).length === 0) {
            alert('Brak danych do eksportu.');
            return;
        }
        syncCodeInput.value = btoa(encodeURIComponent(JSON.stringify(eventsData)));
        syncCodeInput.select();
        alert('Kod wygenerowany i zaznaczony!');
    });

    btnLoadCode.addEventListener('click', () => {
        const code = syncCodeInput.value.trim();
        if (!code) return alert('Wklej kod.');
        try {
            eventsData = JSON.parse(decodeURIComponent(atob(code)));
            localStorage.setItem('planerEvents', JSON.stringify(eventsData));
            renderCalendar(currentMonth, currentYear);
            alert('Wczytano pomyślnie!');
        } catch (e) {
            alert('Błędny kod!');
        }
    });

    const colorOptions = document.querySelectorAll('.color-option');
    const savedColor = localStorage.getItem('planerAccentColor');
    if (savedColor) {
        document.documentElement.style.setProperty('--accent', savedColor);
        colorOptions.forEach(opt => opt.classList.toggle('active', opt.getAttribute('data-color') === savedColor));
    }

    colorOptions.forEach(option => {
        option.addEventListener('click', () => {
            colorOptions.forEach(opt => opt.classList.remove('active'));
            option.classList.add('active');
            const color = option.getAttribute('data-color');
            document.documentElement.style.setProperty('--accent', color);
            localStorage.setItem('planerAccentColor', color);
        });
    });

    prevMonthBtn.addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar(currentMonth, currentYear);
    });

    nextMonthBtn.addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentMonth, currentYear);
    });

    btnCancelModal.addEventListener('click', closeModal);
    btnSaveEvent.addEventListener('click', saveEvent);
    globalAddBtn.addEventListener('click', openModalForGlobalAdd);
    eventModal.addEventListener('click', (e) => { if (e.target === eventModal) closeModal(); });

    updateCategorySelect();
    renderCalendar(currentMonth, currentYear);

    if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
        setTimeout(() => Notification.requestPermission(), 3000);
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
    }
</script>
</body>
</html>
